<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>轻爽课表 · 课表生成器</title>
<style>
  :root{
    --bg:#f3f5f8;
    --card:#ffffff;
    --line:#dfe4ec;
    --line2:#eef1f5;
    --text:#2b2e37;
    --muted:#9aa0ad;
    --brand:#2a6f9e;
    --brand-soft:#e3eef6;
    --soft:#f7f8fb;
    --header-bg:#e8eef5;
    --header-text:#5b6b80;
    --row-odd:#ffffff;
    --row-even:#f5f8fb;
    --row-hover:#eef3f8;
    --radius:16px;
    --radius-sm:11px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
    padding:14px 10px 44px; transition:background .35s;
  }
  .wrap{max-width:1320px;margin:0 auto}
  .brand-bar{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:4px 4px 12px}
  .brand-bar .logo{font-size:23px;font-weight:800;letter-spacing:.04em;color:var(--text)}
  .brand-bar .logo .accent{color:var(--brand)}
  .brand-bar .slogan{font-size:13px;color:var(--muted)}
  .layout{display:flex;gap:14px;align-items:flex-start}

  /* ---- 左：控制面板 ---- */
  .controls{width:290px;flex:0 0 290px;display:flex;flex-direction:column;gap:14px;position:sticky;top:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(20,30,60,.04);padding:16px 18px;transition:background .35s,border-color .35s}
  .card h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 12px;letter-spacing:.04em}

  .name-input{
    width:100%;border:none;outline:none;font-size:22px;font-weight:700;color:var(--text);
    background:transparent;padding:0;margin:0;
  }
  .name-input::placeholder{color:#c8ccd6}
  .term-input{
    width:100%;border:none;outline:none;font-size:14px;color:var(--muted);background:transparent;
    padding:4px 0 0;margin-top:2px;
  }
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .btn{
    border:1px solid var(--line);background:#fff;color:#4a4f5c;border-radius:999px;
    padding:7px 15px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit;
  }
  .btn:hover{border-color:#d7dae1;background:var(--soft)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{filter:brightness(.94)}

  /* ---- scheme picker ---- */
  .schemes{display:flex;align-items:center;gap:9px;margin-top:14px;flex-wrap:wrap}
  .schemes .lab{font-size:12px;color:var(--muted);margin-right:2px}
  .scheme-sw{
    width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);
    cursor:pointer;padding:0;transition:transform .15s,box-shadow .15s;position:relative;
  }
  .scheme-sw:hover{transform:scale(1.1)}
  .scheme-sw.on{box-shadow:0 0 0 2px var(--text)}
  .scheme-sw .nm{
    position:absolute;left:50%;top:30px;transform:translateX(-50%);white-space:nowrap;
    font-size:11px;color:var(--muted);opacity:0;transition:.15s;pointer-events:none;
  }
  .scheme-sw:hover .nm{opacity:1}

  /* ---- setup ---- */
  .setup-grid{display:flex;flex-wrap:wrap;gap:12px 18px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;color:var(--muted)}
  .field input{
    width:78px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:14px;
    outline:none;background:#fff;color:var(--text);font-family:inherit;transition:border-color .15s;
  }
  .field input[type=time]{width:96px}
  .field input:focus{border-color:var(--brand)}

  .steppers{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
  .stepper{display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line2);border-radius:11px;padding:8px 12px}
  .stepper .lbl{font-size:13px;color:#5b6070;min-width:34px}
  .stepper button{
    width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:#fff;color:#555c6b;
    font-size:16px;line-height:1;cursor:pointer;font-family:inherit;transition:.15s;
  }
  .stepper button:hover{border-color:var(--brand);color:var(--brand)}
  .stepper .num{font-size:16px;font-weight:600;min-width:18px;text-align:center}

  /* toggle switch */
  .toggle-row{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line2)}
  .toggle-row label{font-size:12px;color:var(--muted);cursor:pointer}
  .toggle{
    width:40px;height:22px;border-radius:999px;background:#d1d5db;position:relative;cursor:pointer;transition:background .2s;
  }
  .toggle::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;left:2px;top:2px;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .toggle.on{background:var(--brand)}
  .toggle.on::after{left:20px}
  #showTimeState{font-size:13px;color:var(--text);min-width:32px}

  /* ---- course defs ---- */
  .defs-row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
  .chip{
    display:inline-flex;align-items:center;gap:7px;background:var(--soft);border:1px solid var(--line);
    border-radius:999px;padding:5px 10px 5px 9px;cursor:pointer;transition:.15s;user-select:none;
  }
  .chip:hover{border-color:#d7dae1}
  .chip.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft);background:var(--brand-soft);color:var(--brand);font-weight:600}
  .chip.on .cname{color:var(--brand);font-weight:600}
  .chip .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .chip .cname{border:none;outline:none;background:transparent;font-size:13px;color:var(--text);font-family:inherit;width:auto;min-width:24px;padding:0;max-width:90px;pointer-events:none}
  .chip .del{color:#c2c6cf;font-size:12px;margin-left:1px;padding:0 2px}
  .chip .del:hover{color:#e0605c}
  .chip.erase{color:#8a8f9c;font-size:13px}
  .chip.erase.on{color:var(--brand);border-color:var(--brand);background:var(--brand-soft)}
  .addbtn{border:1px dashed #cfd3db;background:#fff;color:#7b818f;border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;font-family:inherit}
  .addbtn:hover{border-color:var(--brand);color:var(--brand)}

  .hint{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6}
  .hint b{color:#6b7280;font-weight:600}

  /* ---- 中：课表主区 ---- */
  .stage{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
  .stage-card{padding:14px 16px 16px}

  /* ---- 右：课程定义 ---- */
  .defs-panel{width:270px;flex:0 0 270px;display:flex;flex-direction:column;gap:14px;position:sticky;top:14px}
  .sched-head{text-align:center;background:var(--card);color:var(--text);border:1px solid var(--line);border-bottom:none;border-radius:var(--radius) var(--radius) 0 0;padding:15px 26px 12px;transition:background .35s,color .35s}
  .sched-title{font-size:34px;font-weight:700;letter-spacing:.22em;color:#1f2937;text-indent:.22em}
  .sched-sub{display:flex;justify-content:space-between;font-size:17px;margin-top:10px;color:#1f2937;font-weight:600}
  .sub-term{text-align:left}
  .sub-class{text-align:right}
  .sched-scroll{border-radius:0 0 var(--radius) var(--radius);overflow:auto;border:1px solid var(--line);border-top:none;background:var(--card);box-shadow:0 4px 18px rgba(20,30,60,.07)}
  table.sched{width:100%;border-collapse:collapse;table-layout:fixed;min-width:640px;border:none}
  table.sched th,table.sched td{border:none;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;vertical-align:middle;transition:background .35s,color .35s,border-color .35s}
  table.sched th:last-child,table.sched td:last-child{border-right:none}
  table.sched thead th{
    background:var(--header-bg);color:var(--header-text);font-weight:600;font-size:13px;padding:12px 6px;
  }
  table.sched thead th.gutter{width:108px;font-size:12px}
  .gutter{background:var(--header-bg);width:108px;transition:background .35s}
  .gutter .pinfo{font-size:12px;color:var(--header-text);font-weight:500}
  .gutter .ptime{font-size:12px;color:var(--header-text);margin-top:2px;font-variant-numeric:tabular-nums;opacity:.95}
  table.sched tbody tr:nth-child(odd) td:not(.gutter){background:var(--row-odd)}
  table.sched tbody tr:nth-child(even) td:not(.gutter){background:var(--row-even)}
  table.sched tbody tr:hover td:not(.gutter){background:var(--row-hover)}
  .cell{height:58px;cursor:pointer;padding:10px 6px;transition:background .12s}
  .cell .cname{font-size:14px;font-weight:600;line-height:1.3}
  .cell.empty .ph{color:#d6d9e0;font-size:18px;opacity:0;transition:.12s}
  .cell.empty:hover .ph{opacity:1}
  .breakrow td{padding:0}
  .breakcell{
    background:var(--soft) !important;color:var(--muted);font-size:12px;text-align:center;padding:7px 6px;
    letter-spacing:.02em;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);
  }
  .breakcell b{color:var(--text);font-weight:600}
  table.sched tbody tr:last-child td{border-bottom:none}

  /* ---- 窄屏：自动堆叠为单列 ---- */
  @media (max-width:1279px){
    .layout{flex-direction:column}
    .controls,.defs-panel{width:auto;flex:none;position:static}
  }

  @media print{
    body{background:#fff;padding:0}
    .layout{gap:0}
    .brand-bar{display:none !important}
    .controls{display:none !important}
    .stage{gap:0}
    .stage-card{border:none;box-shadow:none;padding:0}
    .sched-head{background:#fff !important;border:1px solid #e3e5ea;border-bottom:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .sched-title{font-size:26px;color:#1f2937}
    .sched-sub{font-size:15px;color:#1f2937}
    .sched-scroll{box-shadow:none}
    .cell.empty .ph{display:none}
    .gutter{background:var(--header-bg) !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    table.sched tbody tr:nth-child(odd) td:not(.gutter){background:var(--row-odd) !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    table.sched tbody tr:nth-child(even) td:not(.gutter){background:var(--row-even) !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .cell .cname{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="brand-bar">
    <div class="logo">轻爽<span class="accent">课表</span></div>
    <div class="slogan">单文件课表生成器 · 点选即填 · 中国古典配色</div>
  </header>
  <div class="layout">

    <!-- 左：控制面板 -->
    <aside class="controls">
      <div class="card">
        <h2>班级 / 学期</h2>
        <input id="nameInput" class="name-input" placeholder="班级，如：三年级13班" />
        <input id="termInput" class="term-input" placeholder="学年学期，如：2026–2027学年第一学期" />
        <div class="schemes" id="schemes"><span class="lab">配色</span></div>
        <div class="toolbar">
          <button class="btn primary" id="printBtn">打印 / 存 PDF</button>
          <button class="btn" id="clearBtn">清空课表</button>
          <button class="btn" id="resetBtn">恢复默认</button>
        </div>
      </div>

      <div class="card setup">
        <h2>作息安排 · 节次</h2>
        <div class="setup-grid">
          <div class="field"><label>上午开始</label><input type="time" data-tk="morningStart" value="08:00" /></div>
          <div class="field"><label>每节课(分)</label><input type="number" data-tk="period" min="1" max="120" value="45" /></div>
          <div class="field"><label>课间(分)</label><input type="number" data-tk="brk" min="0" max="60" value="10" /></div>
          <div class="field"><label>午休(分)</label><input type="number" data-tk="lunch" min="0" max="240" value="130" /></div>
          <div class="field"><label>晚休(分)</label><input type="number" data-tk="dinner" min="0" max="180" value="60" /></div>
        </div>
        <div class="toggle-row">
          <span id="showTimeState">显示时间</span>
          <div class="toggle on" id="showTimeToggle"></div>
          <label for="showTimeToggle">课表中显示每节课时间段</label>
        </div>
        <div class="steppers">
          <div class="stepper"><span class="lbl">上午</span><button data-act="dec" data-key="morning">−</button><span class="num" id="n-morning">4</span><button data-act="inc" data-key="morning">+</button><span class="lbl" style="min-width:auto;color:#b8bdc8">节</span></div>
          <div class="stepper"><span class="lbl">下午</span><button data-act="dec" data-key="afternoon">−</button><span class="num" id="n-afternoon">3</span><button data-act="inc" data-key="afternoon">+</button><span class="lbl" style="min-width:auto;color:#b8bdc8">节</span></div>
          <div class="stepper"><span class="lbl">晚上</span><button data-act="dec" data-key="evening">−</button><span class="num" id="n-evening">2</span><button data-act="inc" data-key="evening">+</button><span class="lbl" style="min-width:auto;color:#b8bdc8">节</span></div>
        </div>
      </div>
    </aside>

    <!-- 中：课表主区 -->
    <main class="stage">
      <div class="card stage-card">
        <div id="schedHead"></div>
        <div class="sched-scroll"><div id="schedHost"></div></div>
      </div>
    </main>

    <!-- 右：课程定义 -->
    <aside class="defs-panel">
      <div class="card defs">
        <h2>课程定义 · 点选后在课表格中点击填入</h2>
        <div class="defs-row" id="defsRow"></div>
        <div class="hint">使用方法：<b>①</b> 上方填写班级 → <b>②</b> 设定作息与时长（时间自动推算，含午休自然间隔）→ <b>③</b> 用 ± 调整上下晚节数 → <b>④</b> 在此定义课程 → <b>⑤</b> 点一个课程卡片选中它，再点课表里的格子即可填入；点「✕ 清除」再点格子可擦除。生成后用「配色」切换中国古典配色。</div>
      </div>
    </aside>

  </div>
</div>

<script>
(function(){
  "use strict";
  var DAYS=['周一','周二','周三','周四','周五'];
  var KEY='jjkb-schedule-maker-v1';

  // —— 中国古典配色方案 ——
  var SCHEMES={
    xinzheng:{ name:'新正',
      paper:'#f5f3f0', card:'#ffffff', line:'#e2ddd6',
      brand:'#4fb9a6', brandSoft:'#dff2ee',
      headerBg:'#41393e', headerText:'#f8f8fa',
      rowOdd:'#ffffff', rowEven:'#f5f2ed', rowHover:'#ede9e2',
      palette:['#41393e','#c04851','#4fb9a6','#8b5a2b','#5d4e6d','#0e1a14','#8e354a','#6b4423'] },
    zhongchun:{ name:'仲春',
      paper:'#fcf8ec', card:'#ffffff', line:'#efe5c8',
      brand:'#c68a00', brandSoft:'#f9edd0',
      headerBg:'#1a2f6b', headerText:'#f8f8fa',
      rowOdd:'#ffffff', rowEven:'#f9f5e8', rowHover:'#f2ebd6',
      palette:['#1a2f6b','#c68a00','#2e7db8','#1e6b52','#4a4a9a','#8a6a00','#0f1a4a','#5a5ab8'] },
    taolang:{ name:'桃浪',
      paper:'#faf2f6', card:'#ffffff', line:'#edd8e4',
      brand:'#cd6c92', brandSoft:'#f5e0eb',
      headerBg:'#2e1a26', headerText:'#f8f8fa',
      rowOdd:'#ffffff', rowEven:'#f9f2f6', rowHover:'#f2e4ed',
      palette:['#2e1a26','#9a3d6b','#6b3d6b','#8a2e6b','#b8a82e','#c67a3a','#4a2040','#7a305a'] },
    zhengyang:{ name:'正阳',
      paper:'#f4f8ec', card:'#ffffff', line:'#dde8cc',
      brand:'#79a52e', brandSoft:'#e6f0d6',
      headerBg:'#2f3d3d', headerText:'#f8f8fa',
      rowOdd:'#ffffff', rowEven:'#f1f7e9', rowHover:'#e7f0db',
      palette:['#2f3d3d','#5a8a1e','#c03030','#4a2ec0','#6b9a2e','#b84a4a','#2a5a10','#6a5ad0'] },
    lanyue:{ name:'兰月',
      paper:'#f4f3f0', card:'#ffffff', line:'#e0ddd4',
      brand:'#95886e', brandSoft:'#ece8df',
      headerBg:'#4f6b4f', headerText:'#f8f8fa',
      rowOdd:'#ffffff', rowEven:'#f5f4f1', rowHover:'#edeae4',
      palette:['#4f6b4f','#9a2e5a','#1a8a9a','#1a8a8a','#6b5a4a','#7a8a7a','#3a5a3a','#7a2048'] },
    danyue:{ name:'旦月',
      paper:'#faf2f4', card:'#ffffff', line:'#ecd8dd',
      brand:'#d393a1', brandSoft:'#f5e1e5',
      headerBg:'#4f1a6b', headerText:'#f8f8fa',
      rowOdd:'#ffffff', rowEven:'#f9f2f4', rowHover:'#f2e4e8',
      palette:['#4f1a6b','#1a4f7a','#b82448','#c44a1a','#a86a8a','#8a50a8','#3a1058','#8a1c3a'] },
    juyue:{ name:'菊月',
      paper:'#f9f4ec', card:'#ffffff', line:'#e8d8c4',
      brand:'#c67814', brandSoft:'#f4e6d4',
      headerBg:'#9a1a6b', headerText:'#f8f8fa',
      rowOdd:'#ffffff', rowEven:'#f8f2e9', rowHover:'#f0e6d8',
      palette:['#9a1a6b','#9a5a0a','#2e8a5a','#3a6a7a','#a87a20','#9a709a','#7a1048','#6a4810'] }
  };
  var SCHEME_ORDER=['xinzheng','zhongchun','taolang','zhengyang','lanyue','danyue','juyue'];

  function colorFor(name){
    var h=0;
    for(var i=0;i<name.length;i++){ h=(h*31+name.charCodeAt(i))>>>0; }
    return SCHEMES[state.scheme].palette[h%8];
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }
  function toMin(h){ var p=String(h).split(':'); return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0); }
  function fmt(m){ m=((m%1440)+1440)%1440; var h=Math.floor(m/60), mm=m%60; return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm; }

  var DEFAULT={
    name:'三年级13班',
    term:'2026–2027学年第一学期',
    scheme:'xinzheng',
    time:{morningStart:'08:00',period:45,brk:10,lunch:130,dinner:60,showTime:true},
    counts:{morning:4,afternoon:3,evening:0},
    courses:[
      {id:'c1',name:'语文'},{id:'c2',name:'数学'},{id:'c3',name:'外语'},
      {id:'c4',name:'体育'},{id:'c5',name:'艺术（音乐）'},{id:'c6',name:'艺术（美术）'},
      {id:'c7',name:'科学'},{id:'c8',name:'道德与法治'},{id:'c9',name:'信息科技'},
      {id:'c10',name:'劳动'},{id:'c11',name:'综合实践'},{id:'c12',name:'硬笔书法'},
      {id:'c13',name:'班/安环'},{id:'c14',name:'语文（写字）'},{id:'c15',name:'体育与健康'}
    ],
    grid:{
      '0-0':'c2','1-0':'c1','2-0':'c8','3-0':'c12','4-0':'c3','5-0':'c13',
      '0-1':'c2','1-1':'c1','2-1':'c9','3-1':'c4','4-1':'c1','5-1':'c14',
      '0-2':'c1','1-2':'c2','2-2':'c10','3-2':'c6','4-2':'c4','5-2':'c5',
      '0-3':'c3','1-3':'c2','2-3':'c1','3-3':'c6','4-3':'c7','5-3':'c8',
      '0-4':'c1','1-4':'c5','2-4':'c2','3-4':'c11','4-4':'c7','5-4':'c15'
    }
  };

  var state, brush=null;
  try{ var raw=localStorage.getItem(KEY); state = raw? JSON.parse(raw):null; }catch(e){ state=null; }
  if(!state||!state.courses){ state=JSON.parse(JSON.stringify(DEFAULT)); }
  if(!state.scheme||!SCHEMES[state.scheme]){ state.scheme=DEFAULT.scheme; }
  if(state.time && state.time.showTime===undefined){ state.time.showTime=true; }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  function buildRows(){
    var t=state.time, c=state.counts;
    var cur=toMin(t.morningStart), rows=[], pIdx=-1;
    for(var i=0;i<c.morning;i++){
      var s=cur; cur+=t.period; rows.push({type:'period',session:'上午',n:i+1,s:s,e:cur,pIdx:++pIdx});
      if(i<c.morning-1) cur+=t.brk;
    }
    if(c.morning>0){ var ls=cur; cur+=t.lunch; rows.push({type:'break',label:'午休',s:ls,e:cur}); }
    for(var j=0;j<c.afternoon;j++){
      var s2=cur; cur+=t.period; rows.push({type:'period',session:'下午',n:j+1,s:s2,e:cur,pIdx:++pIdx});
      if(j<c.afternoon-1) cur+=t.brk;
    }
    if(c.afternoon>0 && c.evening>0){ var ds=cur; cur+=t.dinner; rows.push({type:'break',label:'晚休',s:ds,e:cur}); }
    for(var k=0;k<c.evening;k++){
      var s3=cur; cur+=t.period; rows.push({type:'period',session:'晚上',n:k+1,s:s3,e:cur,pIdx:++pIdx});
      if(k<c.evening-1) cur+=t.brk;
    }
    return rows;
  }

  var nameEl=document.getElementById('nameInput');
  var termEl=document.getElementById('termInput');
  var defsEl=document.getElementById('defsRow');
  var schedEl=document.getElementById('schedHost');
  var schedHead=document.getElementById('schedHead');
  var schemesEl=document.getElementById('schemes');
  var showTimeToggle=document.getElementById('showTimeToggle');
  var showTimeState=document.getElementById('showTimeState');

  function applyTheme(){
    var s=SCHEMES[state.scheme], r=document.documentElement.style;
    r.setProperty('--bg',s.paper); r.setProperty('--card',s.card); r.setProperty('--line',s.line);
    r.setProperty('--brand',s.brand); r.setProperty('--brand-soft',s.brandSoft);
    r.setProperty('--soft',s.rowEven); r.setProperty('--header-bg',s.headerBg); r.setProperty('--header-text',s.headerText);
    r.setProperty('--row-odd',s.rowOdd); r.setProperty('--row-even',s.rowEven); r.setProperty('--row-hover',s.rowHover);
  }
  function headHTML(){
    return '<div class="sched-head">'+
      '<div class="sched-title">课程表</div>'+
      '<div class="sched-sub"><span class="sub-term">'+esc(state.term||'')+'</span><span class="sub-class">'+esc(state.name||'')+'</span></div>'+
    '</div>';
  }
  function syncHead(){ schedHead.innerHTML=headHTML(); }
  function renderHead(){ nameEl.value=state.name; termEl.value=state.term; syncHead(); }
  function renderSchemes(){
    var html='<span class="lab">配色</span>';
    SCHEME_ORDER.forEach(function(id){
      var s=SCHEMES[id];
      html+='<button class="scheme-sw '+(state.scheme===id?'on':'')+'" data-id="'+id+'" title="'+s.name+'" style="background:'+s.brand+'"><span class="nm">'+s.name+'</span></button>';
    });
    schemesEl.innerHTML=html;
  }
  function renderSetup(){
    document.querySelectorAll('[data-tk]').forEach(function(inp){ if(state.time[inp.dataset.tk]!==undefined) inp.value=state.time[inp.dataset.tk]; });
    document.getElementById('n-morning').textContent=state.counts.morning;
    document.getElementById('n-afternoon').textContent=state.counts.afternoon;
    document.getElementById('n-evening').textContent=state.counts.evening;
    showTimeToggle.classList.toggle('on', !!state.time.showTime);
    showTimeState.textContent = state.time.showTime ? '显示时间' : '隐藏时间';
  }
  function renderDefs(){
    var html='<div class="chip erase '+(brush==='__erase__'?'on':'')+'" data-id="__erase__" title="选中后点击格子可擦除">✕ 清除</div>';
    state.courses.forEach(function(c){
      var fg=colorFor(c.name);
      html+='<div class="chip '+(brush===c.id?'on':'')+'" data-id="'+c.id+'" title="单击选中，双击改名">'
        +'<span class="dot" style="background:'+fg+'"></span>'
        +'<input class="cname" data-id="'+c.id+'" value="'+esc(c.name)+'">'
        +'<span class="del" data-del="'+c.id+'" title="删除该课程">✕</span></div>';
    });
    html+='<button class="addbtn" id="addCourse">＋ 课程</button>';
    defsEl.innerHTML=html;
  }
  function setBrush(id){
    brush=(brush===id)?null:id;
    var chips=defsEl.querySelectorAll('.chip');
    for(var i=0;i<chips.length;i++){
      chips[i].classList.toggle('on',chips[i].dataset.id===brush);
    }
  }
  function renderSched(){
    var rows=buildRows();
    var showTime=!!state.time.showTime;
    var html='<table class="sched"><thead><tr><th class="gutter">'+(showTime?'节次 / 时间':'节次')+'</th>';
    DAYS.forEach(function(d){ html+='<th>'+d+'</th>'; });
    html+='</tr></thead><tbody>';
    rows.forEach(function(r){
      if(r.type==='break'){
        html+='<tr class="breakrow"><td colspan="'+(DAYS.length+1)+'" class="breakcell"><b>'+r.label+'</b>'+(showTime?' · '+fmt(r.s)+'–'+fmt(r.e):'')+'</td></tr>';
      } else {
        html+='<tr><td class="gutter"><div class="pinfo">'+r.session+' 第'+r.n+'节</div>'+(showTime?'<div class="ptime">'+fmt(r.s)+'–'+fmt(r.e)+'</div>':'')+'</td>';
        for(var di=0; di<DAYS.length; di++){
          var key=r.pIdx+'-'+di;
          var cid=state.grid[key];
          var course=cid?state.courses.find(function(x){return x.id===cid;})||null:null;
          if(course){
            var fg=colorFor(course.name);
            html+='<td class="cell" data-p="'+r.pIdx+'" data-d="'+di+'"><div class="cname" style="color:'+fg+'">'+esc(course.name)+'</div></td>';
          } else {
            html+='<td class="cell empty" data-p="'+r.pIdx+'" data-d="'+di+'"><div class="ph">＋</div></td>';
          }
        }
        html+='</tr>';
      }
    });
    html+='</tbody></table>';
    schedEl.innerHTML=html;
  }
  function renderAll(){ applyTheme(); renderHead(); renderSchemes(); renderSetup(); renderDefs(); renderSched(); }

  function pruneGrid(session,newCount){
    buildRows().forEach(function(r){
      if(r.type==='period'&&r.session===session&&r.n>newCount){
        for(var d=0;d<DAYS.length;d++){ delete state.grid[r.pIdx+'-'+d]; }
      }
    });
  }

  // events
  nameEl.addEventListener('input',function(){ state.name=nameEl.value; save(); syncHead(); });
  termEl.addEventListener('input',function(){ state.term=termEl.value; save(); syncHead(); });

  document.querySelector('.setup').addEventListener('input',function(e){
    var el=e.target.closest('[data-tk]'); if(!el) return;
    var k=el.dataset.tk;
    state.time[k] = (k==='morningStart') ? el.value : parseInt(el.value||0,10);
    save(); renderSched();
  });
  document.querySelector('.steppers').addEventListener('click',function(e){
    var b=e.target.closest('[data-act]'); if(!b) return;
    var k=b.dataset.key, v=state.counts[k]+(b.dataset.act==='inc'?1:-1);
    v=Math.max(0,Math.min(8,v));
    if(v!==state.counts[k]){ pruneGrid(k,v); state.counts[k]=v; save(); renderAll(); }
  });

  showTimeToggle.addEventListener('click',function(){
    state.time.showTime = !state.time.showTime;
    save(); renderSetup(); renderSched();
  });

  schemesEl.addEventListener('click',function(e){
    var b=e.target.closest('.scheme-sw'); if(!b) return;
    state.scheme=b.dataset.id; save(); renderAll();
  });

  defsEl.addEventListener('click',function(e){
    if(e.target.classList.contains('del')){ removeCourse(e.target.dataset.del); return; }
    var chip=e.target.closest('.chip'); if(!chip) return;
    setBrush(chip.dataset.id);
  });
  defsEl.addEventListener('dblclick',function(e){
    if(e.target.classList.contains('del')) return;
    var chip=e.target.closest('.chip'); if(!chip||chip.classList.contains('erase')) return;
    var inp=chip.querySelector('.cname');
    if(inp){
      inp.style.pointerEvents='auto';
      inp.focus();
      inp.select();
      inp.addEventListener('blur',function once(){ inp.style.pointerEvents=''; inp.removeEventListener('blur',once); },{once:true});
    }
    brush=chip.dataset.id;
    var chips=defsEl.querySelectorAll('.chip');
    for(var i=0;i<chips.length;i++){ chips[i].classList.toggle('on',chips[i].dataset.id===brush); }
  });
  defsEl.addEventListener('input',function(e){
    if(e.target.classList.contains('cname')){
      var c=state.courses.find(function(x){return x.id===e.target.dataset.id;});
      if(c){ c.name=e.target.value; save(); renderSched(); }
    }
  });
  defsEl.addEventListener('click',function(e){
    if(e.target.id==='addCourse'){
      var id='c'+Date.now();
      state.courses.push({id:id,name:'新课'}); brush=id; save(); renderDefs();
      var inp=defsEl.querySelector('.cname[data-id="'+id+'"]'); if(inp) inp.focus();
    }
  });
  function removeCourse(id){
    state.courses=state.courses.filter(function(c){return c.id!==id;});
    Object.keys(state.grid).forEach(function(k){ if(state.grid[k]===id) delete state.grid[k]; });
    if(brush===id) brush=null; save(); renderDefs(); renderSched();
  }

  schedEl.addEventListener('click',function(e){
    var td=e.target.closest('.cell'); if(!td) return;
    var key=td.dataset.p+'-'+td.dataset.d;
    if(brush==='__erase__'){ delete state.grid[key]; }
    else if(brush){ state.grid[key]=brush; }
    else if(state.grid[key]){ delete state.grid[key]; }
    save(); renderSched();
  });

  document.getElementById('printBtn').addEventListener('click',function(){ window.print(); });
  document.getElementById('clearBtn').addEventListener('click',function(){ state.grid={}; save(); renderSched(); });
  document.getElementById('resetBtn').addEventListener('click',function(){ state=JSON.parse(JSON.stringify(DEFAULT)); brush=null; save(); renderAll(); });

  renderAll();
})();
</script>
</body>
</html>
